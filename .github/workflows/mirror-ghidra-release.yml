
name: Mirror Official Ghidra 12.1.4 Release

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mirror-ghidra-release.yml

permissions:
  contents: write

jobs:
  mirror-release:
    runs-on: ubuntu-latest

    env:
      TAG: Ghidra_12.1.4_build
      ASSET: ghidra_12.1.4_PUBLIC_20260921.zip
      DOWNLOAD_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      EXPECTED_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db

    steps:
      - name: Download official Ghidra distribution
        run: |
          curl --fail --location \
            --retry 5 \
            --retry-delay 5 \
            --output "$ASSET" \
            "$DOWNLOAD_URL"

      - name: Verify official SHA-256
        run: |
          echo "$EXPECTED_SHA256  $ASSET" | sha256sum --check -

      # Split into two sub-512 MiB artifacts for the transfer connector.
      - name: Split verified ZIP for transfer
        run: split -b 300m --numeric-suffixes=1 --suffix-length=1 "$ASSET" ghidra-part-

      - name: Publish transfer part 1
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.1.4-part-1
          path: ghidra-part-1
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Publish transfer part 2
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-12.1.4-part-2
          path: ghidra-part-2
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Create release and upload distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; uploading or replacing asset."
            gh release upload "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release."
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target master \
              --title "Ghidra 12.1.4" \
              --notes "Official Ghidra 12.1.4 distribution mirrored from NationalSecurityAgency/ghidra. SHA-256 verified before upload."
          fi

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,assets
