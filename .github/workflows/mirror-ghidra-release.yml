
name: Mirror Official Ghidra 12.1.4 Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-release:
    runs-on: ubuntu-latest

    env:
      TAG: Ghidra_12.1.4_build
      ASSET: ghidra_12.1.4_PUBLIC_20260921.zip
      DOWNLOAD_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip
      EXPECTED_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db

    steps:
      - name: Download official Ghidra distribution
        run: |
          curl --fail --location \
            --retry 5 \
            --retry-delay 5 \
            --output "$ASSET" \
            "$DOWNLOAD_URL"

      - name: Verify official SHA-256
        run: |
          echo "$EXPECTED_SHA256  $ASSET" | sha256sum --check -

      - name: Create release and upload distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; uploading or replacing asset."
            gh release upload "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release."
            gh release create "$TAG" "$ASSET" \
              --repo "$GITHUB_REPOSITORY" \
              --target master \
              --title "Ghidra 12.1.4" \
              --notes "Official Ghidra 12.1.4 distribution mirrored from NationalSecurityAgency/ghidra. SHA-256 verified before upload."
          fi

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,assets
